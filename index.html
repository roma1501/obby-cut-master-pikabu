<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Мастер меча: разрежь роботов</title>
    <link rel="icon" type="image/png" href="assets/branding/icon.png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #222;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        /* ПК: игровое поле не шире 2:1 — на сверхшироком или очень низком окне поля по бокам (не полоса).
           transform делает body рамкой для position: fixed (канвас, интерфейс, загрузка). Телефоны — во весь экран. */
        @media (min-aspect-ratio: 2/1) and (hover: hover) and (pointer: fine) {
            html { background: #14102a; }
            body { width: 200vh; margin: 0 auto; position: relative; transform: translateZ(0); }
        }
        input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
        img { -webkit-user-drag: none; }
        #world3d {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        /* Экран загрузки в стиле игры: блочный Roblox-крафт. DOM-контракт движка: #loading-screen, #loading-title,
           #loading-meter, #loading-percent, #loading-retry, .loading-progress, .loading-text. */
        @font-face {
            font-family: 'Montserrat';
            src: url('assets/fonts/montserrat.ttf?v=0.1.0-3b6852d6') format('truetype');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }
        #loading-screen {
            --ink: #1b1530;
            --lu: clamp(0.7px, min(100vw / 420, 100vh / 320), 1.6px);
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: calc(var(--lu) * 12);
            background: #1b1238 url('assets/ui/bg_loading.webp?v=0.1.0-3b6852d6') center / cover no-repeat;
            z-index: 1000;
            overflow: hidden;
            font-family: 'Montserrat', 'Arial Black', system-ui, sans-serif;
            font-weight: 800;
        }
        #loading-screen::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(27, 18, 56, .82) 0, rgba(27, 18, 56, .5) 55%, rgba(27, 18, 56, .1) 100%);
            pointer-events: none;
        }
        #loading-screen > * { position: relative; }
        .ld-blocks { position: absolute !important; inset: 0; pointer-events: none; overflow: hidden; }
        .ld-blocks i {
            position: absolute;
            bottom: -12%;
            left: var(--x);
            width: calc(var(--lu) * var(--s));
            height: calc(var(--lu) * var(--s));
            background: var(--c);
            border: calc(var(--lu) * 3) solid var(--ink);
            border-radius: calc(var(--lu) * 4);
            box-shadow: inset 0 calc(var(--lu) * 3) 0 rgba(255, 255, 255, .4), inset 0 calc(var(--lu) * -3) 0 rgba(0, 0, 0, .22);
            opacity: .9;
            animation: ld-float var(--t) linear var(--d) infinite;
        }
        .ld-sword {
            width: calc(var(--lu) * 92);
            height: calc(var(--lu) * 92);
            object-fit: contain;
            filter: drop-shadow(0 calc(var(--lu) * 6) 0 rgba(0, 0, 0, .35));
            transform-origin: 50% 85%;
            animation: ld-swing 1.3s ease-in-out infinite alternate;
        }
        #loading-title {
            margin: 0;
            max-width: 92vw;
            font-size: calc(var(--lu) * 38);
            font-weight: 900;
            line-height: 1.05;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: .02em;
            color: #ffd23d;
            text-shadow: 0 .04em 0 #ffb000, 0 .08em 0 #e08a00, 0 .12em 0 #c4520a, 0 .16em 0 #c4520a, .07em 0 0 var(--ink),.06em .035em 0 var(--ink),.035em .06em 0 var(--ink),0 .07em 0 var(--ink),-.035em .06em 0 var(--ink),-.06em .035em 0 var(--ink),-.07em 0 0 var(--ink),-.06em -.035em 0 var(--ink),-.035em -.06em 0 var(--ink),0 -.07em 0 var(--ink),.035em -.06em 0 var(--ink),.06em -.035em 0 var(--ink), .07em .16em 0 var(--ink), -.07em .16em 0 var(--ink), 0 .23em 0 var(--ink);
            transform: rotate(-2deg);
        }
        #loading-percent {
            font-size: calc(var(--lu) * 21);
            font-weight: 900;
            color: #fff;
            text-shadow: .09em 0 0 var(--ink),.078em .045em 0 var(--ink),.045em .078em 0 var(--ink),0 .09em 0 var(--ink),-.045em .078em 0 var(--ink),-.078em .045em 0 var(--ink),-.09em 0 0 var(--ink),-.078em -.045em 0 var(--ink),-.045em -.078em 0 var(--ink),0 -.09em 0 var(--ink),.045em -.078em 0 var(--ink),.078em -.045em 0 var(--ink), 0 .14em 0 var(--ink);
        }
        .loading-bar {
            width: min(calc(var(--lu) * 300), 80vw);
            height: calc(var(--lu) * 26);
            box-sizing: border-box;
            border: calc(var(--lu) * 4) solid var(--ink);
            border-radius: calc(var(--lu) * 7);
            background: #2e2458;
            box-shadow: inset 0 calc(var(--lu) * 4) 0 rgba(0, 0, 0, .35), 0 calc(var(--lu) * 5) 0 var(--ink);
            overflow: hidden;
        }
        .loading-progress {
            height: 100%;
            width: 0%;
            background: repeating-linear-gradient(90deg, rgba(0, 0, 0, .2) 0 calc(var(--lu) * 3), transparent calc(var(--lu) * 3) calc(var(--lu) * 16)), linear-gradient(#9af77a 0 32%, #52d63c 32% 100%);
            transition: width .3s ease;
        }
        .loading-text {
            min-height: 1em;
            margin-top: calc(var(--lu) * 6);
            font-size: calc(var(--lu) * 15);
            font-weight: 800;
            text-align: center;
            color: #efeaff;
            text-shadow: .09em 0 0 var(--ink),.078em .045em 0 var(--ink),.045em .078em 0 var(--ink),0 .09em 0 var(--ink),-.045em .078em 0 var(--ink),-.078em .045em 0 var(--ink),-.09em 0 0 var(--ink),-.078em -.045em 0 var(--ink),-.045em -.078em 0 var(--ink),0 -.09em 0 var(--ink),.045em -.078em 0 var(--ink),.078em -.045em 0 var(--ink);
        }
        #loading-retry {
            padding: calc(var(--lu) * 11) calc(var(--lu) * 26);
            border: calc(var(--lu) * 3) solid var(--ink);
            border-radius: calc(var(--lu) * 12);
            background: #ff8a1f;
            color: #fff;
            font: 900 calc(var(--lu) * 19) 'Montserrat', 'Arial Black', system-ui, sans-serif;
            text-transform: uppercase;
            text-shadow: .09em 0 0 var(--ink),.078em .045em 0 var(--ink),.045em .078em 0 var(--ink),0 .09em 0 var(--ink),-.045em .078em 0 var(--ink),-.078em .045em 0 var(--ink),-.09em 0 0 var(--ink),-.078em -.045em 0 var(--ink),-.045em -.078em 0 var(--ink),0 -.09em 0 var(--ink),.045em -.078em 0 var(--ink),.078em -.045em 0 var(--ink);
            box-shadow: inset 0 calc(var(--lu) * 4) 0 rgba(255, 255, 255, .42), inset 0 calc(var(--lu) * -5) 0 rgba(0, 0, 0, .2), 0 calc(var(--lu) * 6) 0 #c4520a, 0 calc(var(--lu) * 6) 0 calc(var(--lu) * 3) var(--ink);
            cursor: pointer;
        }
        #loading-retry:active { transform: translateY(calc(var(--lu) * 5)); }
        #loading-retry[hidden] { display: none; }
        @keyframes ld-swing { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
        @keyframes ld-float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            12% { opacity: .9; }
            100% { transform: translateY(-120vh) rotate(260deg); opacity: .5; }
        }
        @media (prefers-reduced-motion: reduce) { .ld-sword, .ld-blocks i { animation: none; } }
    </style>
</head>
<body>
    <canvas id="world3d"></canvas>
    <div id="loading-screen" role="status" aria-busy="true" aria-live="polite">
        <div class="ld-blocks" aria-hidden="true"><i style="--x:8%;--s:22;--c:#ff8a1f;--t:5.5s;--d:-0s"></i><i style="--x:20%;--s:16;--c:#2f9bff;--t:7s;--d:-1.6s"></i><i style="--x:34%;--s:26;--c:#52d63c;--t:6.2s;--d:-3.1s"></i><i style="--x:47%;--s:14;--c:#ff3d7f;--t:8s;--d:-0.7s"></i><i style="--x:60%;--s:20;--c:#ffcf33;--t:5.8s;--d:-2.4s"></i><i style="--x:72%;--s:28;--c:#9a5cff;--t:6.8s;--d:-4.0s"></i><i style="--x:85%;--s:16;--c:#1fd1bf;--t:7.4s;--d:-1.1s"></i><i style="--x:92%;--s:22;--c:#ff8a1f;--t:6.0s;--d:-3.6s"></i></div>
        <img class="ld-sword" src="assets/ui/icon_sword.png" alt="" aria-hidden="true">
        <h1 id="loading-title">Мастер меча: разрежь роботов</h1>
        <div id="loading-percent">0%</div>
        <div class="loading-bar" id="loading-meter" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="loading-progress"></div></div>
        <div class="loading-text" data-t="loading">Загрузка…</div>
        <button id="loading-retry" type="button" hidden></button>
    </div>

    <script>
        // Игровая область: долгий тап и ПКМ не открывают меню браузера, картинки не
        // тянутся, текст не выделяется — кроме настоящих полей ввода.
        (() => {
            const isField = t => t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
            for (const type of ['contextmenu', 'dragstart', 'selectstart']) {
                document.addEventListener(type, e => { if (!isField(e.target)) e.preventDefault(); });
            }
        })();
    </script>
